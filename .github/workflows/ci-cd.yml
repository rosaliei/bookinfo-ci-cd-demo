name: bookinfo-ci-cd

# Step 1: Trigger on code changes
on:
  push:
    branches: [main]
    paths: ["productpage/**", "ratings/**", ".github/workflows/ci-cd.yml"]
  pull_request:
    paths: ["productpage/**", "ratings/**", ".github/workflows/ci-cd.yml"]

# Cancel an older run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Step 1 (cont.): find which services changed
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            productpage:
              - 'productpage/**'
              - '.github/workflows/ci-cd.yml'
            ratings:
              - 'ratings/**'
              - '.github/workflows/ci-cd.yml'

  # Steps 2 + 3: Checkout, setup, unit tests
  test-productpage:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'productpage')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: productpage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: productpage/*requirements.txt
      # Install separately like the Dockerfile: the two files pin different certifi versions
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install --require-hashes -r test-requirements.txt
      - run: python -m unittest discover tests/unit

  test-ratings:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'ratings')
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: ratings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm install
      # ratings has no unit tests yet; at least check the code parses
      - run: node --check ratings.js

  # Step 4: SAST and secret scan (runs in parallel with tests)
  sast:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans commit history
      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --severity ERROR --error productpage ratings
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 5: Dependency scan (runs in parallel with tests)
  dependency-scan:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Steps 6, 7, 8: Build image, scan image, push image
  build-scan-push:
    needs: [changes, test-productpage, test-ratings, sast, dependency-scan]
    # run if nothing failed (a skipped test job is fine)
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # report scan results for every image
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/bookinfo-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Step 6: Build (with layer cache)
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          build-args: service_version=v1
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Step 7: Image scan
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Step 8: Push (main branch only)
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
