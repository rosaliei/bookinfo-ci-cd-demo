name: bookinfo-ci-cd

# Step 1: Trigger on code changes
on:
  push:
    branches: [main]
    paths: ["productpage/**", "ratings/**", ".github/workflows/ci-cd.yml"]
  pull_request:
    paths: ["productpage/**", "ratings/**", ".github/workflows/ci-cd.yml"]

# Cancel an older run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Step 1 (cont.): find which services changed
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            productpage:
              - 'productpage/**'
              - '.github/workflows/ci-cd.yml'
            ratings:
              - 'ratings/**'
              - '.github/workflows/ci-cd.yml'

  # Steps 2 + 3: Checkout, setup, unit tests
  test-productpage:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'productpage')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: productpage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: productpage/*requirements.txt
      - run: pip install --require-hashes -r requirements.txt -r test-requirements.txt
      - run: python -m unittest discover tests/unit

  test-ratings:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.services), 'ratings')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: ratings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "23"
      - run: npm install
      # ratings has no unit tests yet; at least check the code parses
      - run: node --check ratings.js

  # Step 4: SAST and secret scan (runs in parallel with tests)
  sast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans commit history
      - name: SAST (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config auto --severity ERROR --error productpage ratings
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 5: Dependency scan (runs in parallel with tests)
  dependency-scan:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Steps 6, 7, 8: Build image, scan image, push image
  build-scan-push:
    needs: [changes, test-productpage, test-ratings, sast, dependency-scan]
    # run if nothing failed (a skipped test job is fine)
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${owner}/bookinfo-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      # Step 6: Build (with layer cache)
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          build-args: service_version=v1
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Step 7: Image scan
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Step 8: Push (main branch only)
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
