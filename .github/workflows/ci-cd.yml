name: bookinfo-ci-cd

# Step 1: Trigger on code changes
on:
  push:
    branches: [main]
    paths: ["productpage/**", "ratings/**", "MODULE.bazel", ".bazelrc", ".bazelversion", ".github/workflows/ci-cd.yml"]
  pull_request:
    paths: ["productpage/**", "ratings/**", "MODULE.bazel", ".bazelrc", ".bazelversion", ".github/workflows/ci-cd.yml"]

# Cancel an older run on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Step 1 (cont.): find which services changed
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - 'MODULE.bazel'
              - '.bazelrc'
              - '.bazelversion'
              - '.github/workflows/ci-cd.yml'
            productpage:
              - *shared
              - 'productpage/**'
            ratings:
              - *shared
              - 'ratings/**'

  # Steps 2 + 3: Checkout, setup, unit tests (Bazel)
  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        exclude:
          - service: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.service }}
          repository-cache: true
      - run: bazel test //${{ matrix.service }}/...

  # Step 4: SAST and secret scan (runs in parallel with tests)
  sast:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans commit history
      - name: SAST (Semgrep)
        run: pipx run semgrep==1.180.0 scan --config auto --severity ERROR --error productpage ratings
      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Step 5: Dependency scan (runs in parallel with tests)
  dependency-scan:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Steps 6, 7, 8: Build image, scan image, push image (Bazel + rules_oci)
  build-scan-push:
    needs: [changes, test, sast, dependency-scan]
    if: |
      !cancelled() && !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # report scan results for every image
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        exclude:
          - service: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ matrix.service }}
          repository-cache: true

      # Step 6: Build the image and load it into the runner's Docker as bookinfo-<service>:ci
      - name: Build image
        run: bazel run //${{ matrix.service }}:load

      # Step 7: Image scan
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bookinfo-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Step 8: Push (main branch only)
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bazel run //${{ matrix.service }}:push -- --tag ${{ github.sha }} --tag latest
